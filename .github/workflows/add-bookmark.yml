name: Add Bookmark

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL (article, post, podcast, etc.)"
        required: true
        type: string
      commentary:
        description: 'Commentary in Markdown (\n = newline, e.g. "- a\n- b" for bullets; \n\n = new paragraph)'
        required: false
        type: string

jobs:
  add-bookmark:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Restrict workflow to specific users
    if: github.actor == 'anu-rock'

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: SKIP_POSTINSTALL=1 npm install

      # Step 4: Run the create-bookmark script
      # Inputs go through env, not string interpolation, so quotes/backticks in
      # the commentary can't break (or inject into) the shell command.
      - name: Create bookmark
        env:
          BOOKMARK_URL: ${{ github.event.inputs.url }}
          BOOKMARK_COMMENTARY: ${{ github.event.inputs.commentary }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm run create-bookmark "$BOOKMARK_URL" "$BOOKMARK_COMMENTARY"

      # Step 5: Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "AnuRock"
          git config --global user.email "echo@anurock.dev"
          git add .
          git commit -m "Add bookmark"
          git push
