name: Add Note

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Note in Markdown (\n = newline, e.g. "- a\n- b" for bullets; \n\n = new paragraph)'
        required: true
        type: string
      title:
        description: "Title (optional)"
        required: false
        type: string
      coverImageUrl:
        description: "Cover image URL (optional, downloaded into the repo)"
        required: false
        type: string
      imageAlt:
        description: "Cover image alt text (optional)"
        required: false
        type: string

jobs:
  add-note:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Restrict workflow to specific users
    if: github.actor == 'anu-rock'

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: SKIP_POSTINSTALL=1 npm install

      # Step 4: Run the create-note script
      # Inputs go through env, not string interpolation, so quotes/backticks in
      # the note can't break (or inject into) the shell command.
      - name: Create note
        env:
          NOTE: ${{ github.event.inputs.note }}
          NOTE_TITLE: ${{ github.event.inputs.title }}
          NOTE_COVER_IMAGE_URL: ${{ github.event.inputs.coverImageUrl }}
          NOTE_IMAGE_ALT: ${{ github.event.inputs.imageAlt }}
        run: npm run create-note "$NOTE" "$NOTE_TITLE" "$NOTE_COVER_IMAGE_URL" "$NOTE_IMAGE_ALT"

      # Step 5: Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "AnuRock"
          git config --global user.email "echo@anurock.dev"
          git add .
          git commit -m "Add note"
          git push
